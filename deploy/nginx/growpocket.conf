server {
    listen 80;
    server_name _;

    # 手机拍照/短视频上传（默认 1m 会 413）
    client_max_body_size 100m;

    root /opt/growpocket/frontend;
    index index.html;

    # 管理后台静态文件
    location /admin/ {
        alias /opt/growpocket/adminfront/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        # IP 白名单示例（取消注释启用，替换为允许的 IP 段）:
        # allow 192.168.1.0/24;
        # allow 10.0.0.1;
        # deny all;
    }

    # 前端静态文件
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        client_max_body_size 100m;
        # limit_req_zone 管理后台登录限流示例（不启用，如需在 http 块配置后取消注释）:
        # limit_req zone=admin_login burst=5 nodelay;
    }

    # 上传文件访问
    location /uploads/ {
        alias /opt/growpocket/backend/uploads/;
        expires 7d;
    }
}
