<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI助理 · 切换儿童</title>
    <style id="theme-vars">
/* ===== GrowPocket AI Assistant — Design Tokens ===== */
/* Brand prefix: gp | Single primary hue: warm orange #F59E6B */

:root {
  /* --- Surfaces --- */
  --gp-background: #FFFAF4;
  --gp-foreground: #2D2A26;

  --gp-card: #FFFFFF;
  --gp-card-foreground: #2D2A26;

  --gp-popover: #FFFFFF;
  --gp-popover-foreground: #2D2A26;

  --gp-muted: #FFF1E6;
  --gp-muted-foreground: #7A7168;

  /* --- Brand primary (single hue) --- */
  --gp-primary: #F59E6B;
  --gp-primary-foreground: #FFFFFF;

  /* --- Lines & inputs --- */
  --gp-border: #F5E6D3;
  --gp-input: #F5E6D3;
  --gp-ring: #F59E6B;

  /* --- State colors (semantic only, not brand) --- */
  --gp-state-success: #6DBF7B;
  --gp-state-warning: #F0B848;
  --gp-state-error: #E87461;
  --gp-state-info: #5B9BD5;

  /* --- Radius scale --- */
  --gp-radius-sm: 8px;
  --gp-radius-md: 12px;
  --gp-radius-lg: 16px;
  --gp-radius-pill: 999px;

  /* --- Typography --- */
  --gp-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--gp-background);
    --color-foreground: var(--gp-foreground);
    --color-card: var(--gp-card);
    --color-card-foreground: var(--gp-card-foreground);
    --color-popover: var(--gp-popover);
    --color-popover-foreground: var(--gp-popover-foreground);
    --color-primary: var(--gp-primary);
    --color-primary-foreground: var(--gp-primary-foreground);
    --color-muted: var(--gp-muted);
    --color-muted-foreground: var(--gp-muted-foreground);
    --color-border: var(--gp-border);
    --color-input: var(--gp-input);
    --color-ring: var(--gp-ring);
    --radius-sm: var(--gp-radius-sm);
    --radius-md: var(--gp-radius-md);
    --radius-lg: var(--gp-radius-lg);
  }
  @layer base {
    body { background: var(--gp-background); color: var(--gp-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--gp-background); }
      .text-background { color: var(--gp-background); }
      .border-background { border-color: var(--gp-background); }
      .ring-background { --tw-ring-color: var(--gp-background); }
      .bg-foreground { background-color: var(--gp-foreground); }
      .text-foreground { color: var(--gp-foreground); }
      .border-foreground { border-color: var(--gp-foreground); }
      .ring-foreground { --tw-ring-color: var(--gp-foreground); }
      .bg-card { background-color: var(--gp-card); }
      .text-card { color: var(--gp-card); }
      .border-card { border-color: var(--gp-card); }
      .ring-card { --tw-ring-color: var(--gp-card); }
      .bg-card-foreground { background-color: var(--gp-card-foreground); }
      .text-card-foreground { color: var(--gp-card-foreground); }
      .border-card-foreground { border-color: var(--gp-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--gp-card-foreground); }
      .bg-popover { background-color: var(--gp-popover); }
      .text-popover { color: var(--gp-popover); }
      .border-popover { border-color: var(--gp-popover); }
      .ring-popover { --tw-ring-color: var(--gp-popover); }
      .bg-popover-foreground { background-color: var(--gp-popover-foreground); }
      .text-popover-foreground { color: var(--gp-popover-foreground); }
      .border-popover-foreground { border-color: var(--gp-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--gp-popover-foreground); }
      .bg-primary { background-color: var(--gp-primary); }
      .text-primary { color: var(--gp-primary); }
      .border-primary { border-color: var(--gp-primary); }
      .ring-primary { --tw-ring-color: var(--gp-primary); }
      .bg-primary-foreground { background-color: var(--gp-primary-foreground); }
      .text-primary-foreground { color: var(--gp-primary-foreground); }
      .border-primary-foreground { border-color: var(--gp-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--gp-primary-foreground); }
      .bg-muted { background-color: var(--gp-muted); }
      .text-muted { color: var(--gp-muted); }
      .border-muted { border-color: var(--gp-muted); }
      .ring-muted { --tw-ring-color: var(--gp-muted); }
      .bg-muted-foreground { background-color: var(--gp-muted-foreground); }
      .text-muted-foreground { color: var(--gp-muted-foreground); }
      .border-muted-foreground { border-color: var(--gp-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--gp-muted-foreground); }
      .bg-border { background-color: var(--gp-border); }
      .text-border { color: var(--gp-border); }
      .border-border { border-color: var(--gp-border); }
      .ring-border { --tw-ring-color: var(--gp-border); }
      .bg-input { background-color: var(--gp-input); }
      .text-input { color: var(--gp-input); }
      .border-input { border-color: var(--gp-input); }
      .ring-input { --tw-ring-color: var(--gp-input); }
      .bg-ring { background-color: var(--gp-ring); }
      .text-ring { color: var(--gp-ring); }
      .border-ring { border-color: var(--gp-ring); }
      .ring-ring { --tw-ring-color: var(--gp-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <style id="critical-layout">
        /* Mobile app frame — centered, max-width 448px */
        .app-frame {
          max-width: 448px;
          margin: 0 auto;
          position: relative;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          background: var(--gp-background);
          box-shadow: 0 0 32px rgba(45, 42, 38, 0.06);
        }
        @media (max-width: 480px) {
          .app-frame { box-shadow: none; }
        }
        /* Sticky header (z-50) — always visible, not dimmed */
        .app-header {
          position: sticky;
          top: 0;
          z-index: 50;
        }
        /* Sticky bottom input (z-30) — dimmed by scrim above it */
        .app-input {
          position: sticky;
          bottom: 0;
          z-index: 30;
        }
        /* Scrim overlay (z-40) — covers area below header down to bottom */
        .switch-scrim {
          position: absolute;
          top: 56px;
          bottom: 0;
          left: 0;
          right: 0;
          z-index: 40;
          background: rgba(0, 0, 0, 0.3);
        }
        /* Child switch popover (z-50) — anchored below header right side */
        .switch-popover {
          position: absolute;
          top: 64px;
          right: 16px;
          z-index: 50;
          width: 240px;
          box-shadow: 0 12px 32px rgba(45, 42, 38, 0.18), 0 4px 8px rgba(45, 42, 38, 0.08);
        }
        /* Popover pointer arrow */
        .switch-popover::before {
          content: "";
          position: absolute;
          top: -6px;
          right: 22px;
          width: 12px;
          height: 12px;
          background: var(--gp-card);
          border-top: 1px solid var(--gp-border);
          border-left: 1px solid var(--gp-border);
          transform: rotate(45deg);
          border-top-left-radius: 2px;
        }
      </style>

      <div class="app-frame">
        <!-- ===== Section 1: Fixed Header (sticky, z-50) ===== -->
        <header class="app-header bg-card/95 backdrop-blur border-b border-border">
          <div class="flex items-center justify-between px-4 py-2.5">
            <!-- Left: drawer toggle -->
            <button
              type="button"
              class="flex items-center justify-center w-9 h-9 rounded-full text-muted-foreground hover:bg-muted transition-colors"
              data-dom-id="drawer-toggle"
              aria-label="打开菜单"
            >
              <i data-lucide="panel-left" class="w-5 h-5"></i>
            </button>

            <!-- Right: child switch (active) + voice toggle -->
            <div class="flex items-center gap-1.5">
              <!-- Child avatar switch — ACTIVE state (ring-2 ring-primary ring-offset-2) -->
              <button
                type="button"
                class="relative flex items-center justify-center"
                data-dom-id="child-switch"
                aria-label="切换儿童"
                aria-expanded="true"
              >
                <span class="flex items-center justify-center w-9 h-9 rounded-full bg-primary/15 text-primary font-bold text-base ring-2 ring-primary ring-offset-2 ring-offset-card">明</span>
                <span class="absolute -bottom-0.5 -right-0.5 flex items-center justify-center w-4 h-4 rounded-full bg-card border border-border">
                  <i data-lucide="chevron-down" class="w-2.5 h-2.5 text-muted-foreground"></i>
                </span>
              </button>

              <!-- Voice toggle -->
              <button
                type="button"
                class="flex items-center justify-center w-9 h-9 rounded-full text-muted-foreground hover:bg-muted transition-colors"
                data-dom-id="voice-toggle"
                aria-label="语音"
              >
                <i data-lucide="volume-2" class="w-5 h-5"></i>
              </button>
            </div>
          </div>
        </header>

        <!-- ===== Section 2: Body — Empty State (dimmed) ===== -->
        <section class="flex-1 flex flex-col items-center justify-center px-6 py-12 opacity-60">
          <!-- IP character image -->
          <img
            src="../assets/ip-sprouty-hero.jpg"
            alt="小萌芽"
            class="w-28 h-28 rounded-2xl object-cover mb-5 bg-muted"
          />
          <!-- Greeting -->
          <h2 class="text-lg font-semibold text-foreground mb-1.5">下午好，我是小萌芽</h2>
          <p class="text-sm text-muted-foreground mb-6 text-center">和我聊聊孩子的成长吧</p>
          <!-- Quick phrase chips -->
          <div class="flex flex-col gap-2.5 w-full max-w-xs">
            <button
              type="button"
              class="flex items-center gap-2 px-4 py-2.5 rounded-full bg-card border border-border text-sm text-foreground text-left transition-colors hover:bg-muted/50"
            >
              <i data-lucide="sparkles" class="w-4 h-4 text-primary flex-shrink-0"></i>
              <span class="truncate">今天小明表现怎么样？</span>
            </button>
            <button
              type="button"
              class="flex items-center gap-2 px-4 py-2.5 rounded-full bg-card border border-border text-sm text-foreground text-left transition-colors hover:bg-muted/50"
            >
              <i data-lucide="book-open" class="w-4 h-4 text-primary flex-shrink-0"></i>
              <span class="truncate">推荐一个睡前故事</span>
            </button>
          </div>
        </section>

        <!-- ===== Section 3: Scrim Overlay (absolute, z-40) ===== -->
        <div class="switch-scrim" data-dom-id="switch-scrim" aria-hidden="true"></div>

        <!-- ===== Section 4: Child Switch Popover (absolute, z-50) ===== -->
        <div
          class="switch-popover bg-card rounded-lg border border-border overflow-hidden flex flex-col"
          data-dom-id="child-switch-popover"
          role="listbox"
          aria-label="选择儿童"
        >
          <!-- Popover Header -->
          <div class="px-4 py-2.5 border-b border-border bg-muted/50">
            <span class="text-xs font-semibold text-muted-foreground">选择儿童</span>
          </div>

          <!-- Child List -->
          <div class="py-1">
            <!-- Child 1 (selected) -->
            <button
              type="button"
              class="flex items-center gap-3 w-full px-3 py-2.5 bg-primary/5 border-l-2 border-primary text-left transition-colors"
              data-dom-id="child-option-1"
              role="option"
              aria-selected="true"
            >
              <span class="flex items-center justify-center w-9 h-9 rounded-full bg-primary/15 text-primary font-bold text-sm flex-shrink-0">明</span>
              <span class="flex-1 min-w-0">
                <span class="block text-sm font-medium text-foreground">小明</span>
                <span class="block text-xs text-muted-foreground">2850 积分</span>
              </span>
              <i data-lucide="check" class="w-[18px] h-[18px] text-primary flex-shrink-0"></i>
            </button>

            <!-- Child 2 -->
            <button
              type="button"
              class="flex items-center gap-3 w-full px-3 py-2.5 hover:bg-muted/50 text-left transition-colors"
              data-dom-id="child-option-2"
              role="option"
              aria-selected="false"
            >
              <span class="flex items-center justify-center w-9 h-9 rounded-full bg-muted text-muted-foreground font-bold text-sm flex-shrink-0">红</span>
              <span class="flex-1 min-w-0">
                <span class="block text-sm font-medium text-foreground">小红</span>
                <span class="block text-xs text-muted-foreground">3200 积分</span>
              </span>
            </button>

            <!-- Divider -->
            <div class="h-px bg-border my-0.5"></div>

            <!-- Add Child -->
            <button
              type="button"
              class="flex items-center gap-3 w-full px-3 py-2.5 hover:bg-muted/50 text-left transition-colors"
              data-dom-id="add-child"
            >
              <span class="flex items-center justify-center w-9 h-9 rounded-full border-2 border-dashed border-border text-muted-foreground flex-shrink-0">
                <i data-lucide="user-plus" class="w-4 h-4"></i>
              </span>
              <span class="text-sm text-muted-foreground">添加孩子</span>
            </button>
          </div>
        </div>

        <!-- ===== Section 5: Bottom Input (sticky, z-30) — dimmed ===== -->
        <footer class="app-input bg-card/95 backdrop-blur border-t border-border opacity-60">
          <div class="flex items-center gap-2 px-4 py-3">
            <button
              type="button"
              class="flex items-center justify-center w-9 h-9 rounded-full text-muted-foreground hover:bg-muted transition-colors flex-shrink-0"
              aria-label="更多"
            >
              <i data-lucide="plus" class="w-5 h-5"></i>
            </button>
            <div class="flex-1 flex items-center gap-2 px-4 py-2 rounded-full bg-muted border border-border">
              <input
                type="text"
                placeholder="发消息给小萌芽..."
                class="flex-1 bg-transparent text-sm text-foreground placeholder:text-muted-foreground outline-none min-w-0"
              />
              <button type="button" class="text-muted-foreground flex-shrink-0" aria-label="表情">
                <i data-lucide="smile" class="w-5 h-5"></i>
              </button>
            </div>
            <button
              type="button"
              class="flex items-center justify-center w-9 h-9 rounded-full bg-primary text-primary-foreground flex-shrink-0 transition-colors hover:opacity-90"
              data-dom-id="send-btn"
              aria-label="发送"
            >
              <i data-lucide="send" class="w-4 h-4"></i>
            </button>
          </div>
        </footer>
      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
