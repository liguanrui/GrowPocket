<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI助理 · 历史抽屉</title>
    <style id="theme-vars">
/* ===== GrowPocket AI Assistant — Design Tokens ===== */
/* Brand prefix: gp | Single primary hue: warm orange #F59E6B */

:root {
  /* --- Surfaces --- */
  --gp-background: #FFFAF4;
  --gp-foreground: #2D2A26;

  --gp-card: #FFFFFF;
  --gp-card-foreground: #2D2A26;

  --gp-popover: #FFFFFF;
  --gp-popover-foreground: #2D2A26;

  --gp-muted: #FFF1E6;
  --gp-muted-foreground: #7A7168;

  /* --- Brand primary (single hue) --- */
  --gp-primary: #F59E6B;
  --gp-primary-foreground: #FFFFFF;

  /* --- Lines & inputs --- */
  --gp-border: #F5E6D3;
  --gp-input: #F5E6D3;
  --gp-ring: #F59E6B;

  /* --- State colors (semantic only, not brand) --- */
  --gp-state-success: #6DBF7B;
  --gp-state-warning: #F0B848;
  --gp-state-error: #E87461;
  --gp-state-info: #5B9BD5;

  /* --- Radius scale --- */
  --gp-radius-sm: 8px;
  --gp-radius-md: 12px;
  --gp-radius-lg: 16px;
  --gp-radius-pill: 999px;

  /* --- Typography --- */
  --gp-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--gp-background);
    --color-foreground: var(--gp-foreground);
    --color-card: var(--gp-card);
    --color-card-foreground: var(--gp-card-foreground);
    --color-popover: var(--gp-popover);
    --color-popover-foreground: var(--gp-popover-foreground);
    --color-primary: var(--gp-primary);
    --color-primary-foreground: var(--gp-primary-foreground);
    --color-muted: var(--gp-muted);
    --color-muted-foreground: var(--gp-muted-foreground);
    --color-border: var(--gp-border);
    --color-input: var(--gp-input);
    --color-ring: var(--gp-ring);
    --radius-sm: var(--gp-radius-sm);
    --radius-md: var(--gp-radius-md);
    --radius-lg: var(--gp-radius-lg);
  }
  @layer base {
    body { background: var(--gp-background); color: var(--gp-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--gp-background); }
      .text-background { color: var(--gp-background); }
      .border-background { border-color: var(--gp-background); }
      .ring-background { --tw-ring-color: var(--gp-background); }
      .bg-foreground { background-color: var(--gp-foreground); }
      .text-foreground { color: var(--gp-foreground); }
      .border-foreground { border-color: var(--gp-foreground); }
      .ring-foreground { --tw-ring-color: var(--gp-foreground); }
      .bg-card { background-color: var(--gp-card); }
      .text-card { color: var(--gp-card); }
      .border-card { border-color: var(--gp-card); }
      .ring-card { --tw-ring-color: var(--gp-card); }
      .bg-card-foreground { background-color: var(--gp-card-foreground); }
      .text-card-foreground { color: var(--gp-card-foreground); }
      .border-card-foreground { border-color: var(--gp-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--gp-card-foreground); }
      .bg-popover { background-color: var(--gp-popover); }
      .text-popover { color: var(--gp-popover); }
      .border-popover { border-color: var(--gp-popover); }
      .ring-popover { --tw-ring-color: var(--gp-popover); }
      .bg-popover-foreground { background-color: var(--gp-popover-foreground); }
      .text-popover-foreground { color: var(--gp-popover-foreground); }
      .border-popover-foreground { border-color: var(--gp-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--gp-popover-foreground); }
      .bg-primary { background-color: var(--gp-primary); }
      .text-primary { color: var(--gp-primary); }
      .border-primary { border-color: var(--gp-primary); }
      .ring-primary { --tw-ring-color: var(--gp-primary); }
      .bg-primary-foreground { background-color: var(--gp-primary-foreground); }
      .text-primary-foreground { color: var(--gp-primary-foreground); }
      .border-primary-foreground { border-color: var(--gp-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--gp-primary-foreground); }
      .bg-muted { background-color: var(--gp-muted); }
      .text-muted { color: var(--gp-muted); }
      .border-muted { border-color: var(--gp-muted); }
      .ring-muted { --tw-ring-color: var(--gp-muted); }
      .bg-muted-foreground { background-color: var(--gp-muted-foreground); }
      .text-muted-foreground { color: var(--gp-muted-foreground); }
      .border-muted-foreground { border-color: var(--gp-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--gp-muted-foreground); }
      .bg-border { background-color: var(--gp-border); }
      .text-border { color: var(--gp-border); }
      .border-border { border-color: var(--gp-border); }
      .ring-border { --tw-ring-color: var(--gp-border); }
      .bg-input { background-color: var(--gp-input); }
      .text-input { color: var(--gp-input); }
      .border-input { border-color: var(--gp-input); }
      .ring-input { --tw-ring-color: var(--gp-input); }
      .bg-ring { background-color: var(--gp-ring); }
      .text-ring { color: var(--gp-ring); }
      .border-ring { border-color: var(--gp-ring); }
      .ring-ring { --tw-ring-color: var(--gp-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="app-shell bg-background" data-region="app-shell">
      <style id="critical-layout">
        .app-shell{position:relative;max-width:448px;margin-left:auto;margin-right:auto;display:flex;flex-direction:column;overflow:hidden;height:100dvh}
        .app-header{flex-shrink:0}
        .app-input{flex-shrink:0}
        .chat-scroll{flex:1 1 0%;overflow-y:auto;-webkit-overflow-scrolling:touch}
        .drawer-scrim{position:absolute;inset:0;background:rgba(0,0,0,0.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:50}
        .drawer-panel{position:absolute;top:0;bottom:0;left:0;width:85%;max-width:340px;display:flex;flex-direction:column;height:100%;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,0.18)}
        .session-list-scroll{flex:1 1 0%;overflow-y:auto;-webkit-overflow-scrolling:touch}
        .session-list-scroll::-webkit-scrollbar{width:4px}
        .session-list-scroll::-webkit-scrollbar-thumb{background:var(--gp-border);border-radius:999px}
      </style>

      <!-- Section 1: Fixed Header (visible behind scrim) -->
      <header class="app-header sticky top-0 z-50 border-b border-border bg-card/80 backdrop-blur" data-region="header-behind">
        <div class="flex items-center justify-between px-4 py-3">
          <div class="flex items-center gap-1">
            <button class="flex h-9 w-9 items-center justify-center rounded-lg text-muted-foreground hover:bg-muted" data-dom-id="drawer-toggle" aria-label="打开抽屉">
              <i data-lucide="panel-left" class="h-5 w-5"></i>
            </button>
            <button class="flex h-9 w-9 items-center justify-center rounded-lg text-muted-foreground hover:bg-muted" data-dom-id="new-session" aria-label="新会话">
              <i data-lucide="square-pen" class="h-5 w-5"></i>
            </button>
          </div>
          <div class="flex items-center gap-2">
            <button class="flex items-center gap-1.5 rounded-full bg-muted py-1 pl-1 pr-2.5" data-dom-id="child-switch">
              <span class="flex h-7 w-7 items-center justify-center rounded-full bg-primary text-xs font-semibold text-primary-foreground">明</span>
              <span class="text-sm font-medium text-foreground">小明</span>
              <i data-lucide="chevron-down" class="h-4 w-4 text-muted-foreground"></i>
            </button>
            <button class="flex h-9 w-9 items-center justify-center rounded-lg text-muted-foreground hover:bg-muted" data-dom-id="voice-toggle" aria-label="语音">
              <i data-lucide="volume-2" class="h-5 w-5"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- Section 2: Body — Chat content (dimmed by scrim) -->
      <div class="chat-scroll px-4 py-6" data-region="chat-body-dimmed">
        <div class="space-y-4">
          <!-- AI message -->
          <div class="flex items-start gap-2.5">
            <img src="../assets/ip-sprouty-hero.jpg" alt="AI助手" class="h-8 w-8 flex-shrink-0 rounded-full object-cover">
            <div class="max-w-[75%] rounded-2xl rounded-tl-md border border-border bg-card px-4 py-2.5 text-sm text-foreground">
              你好小明！今天有什么需要帮忙的吗？
            </div>
          </div>
          <!-- Child message -->
          <div class="flex items-start justify-end gap-2.5">
            <div class="max-w-[75%] rounded-2xl rounded-br-md bg-primary px-4 py-2.5 text-sm text-primary-foreground">
              我的积分是多少？
            </div>
          </div>
          <!-- AI message -->
          <div class="flex items-start gap-2.5">
            <img src="../assets/ip-sprouty-hero.jpg" alt="AI助手" class="h-8 w-8 flex-shrink-0 rounded-full object-cover">
            <div class="max-w-[75%] rounded-2xl rounded-tl-md border border-border bg-card px-4 py-2.5 text-sm text-foreground">
              你当前有 <span class="font-semibold text-primary">2850 积分</span>，继续保持哦！
            </div>
          </div>
        </div>
      </div>

      <!-- Section 5: Bottom Input (visible behind scrim) -->
      <div class="app-input sticky bottom-0 z-30 border-t border-border bg-card px-3 py-3" data-region="bottom-input">
        <div class="flex items-center gap-2">
          <div class="flex h-10 flex-1 items-center gap-2 rounded-full bg-muted px-4">
            <input type="text" placeholder="输入消息..." class="flex-1 bg-transparent text-sm text-foreground placeholder:text-muted-foreground focus:outline-none">
          </div>
          <button class="flex h-10 w-10 items-center justify-center rounded-full bg-muted text-muted-foreground" aria-label="键盘">
            <i data-lucide="keyboard" class="h-5 w-5"></i>
          </button>
          <button class="flex h-10 w-10 items-center justify-center rounded-full bg-primary text-primary-foreground" data-dom-id="send-btn" aria-label="发送">
            <i data-lucide="arrow-up" class="h-5 w-5"></i>
          </button>
        </div>
      </div>

      <!-- Section 3: Scrim Overlay -->
      <div class="drawer-scrim" data-dom-id="drawer-scrim" data-region="scrim"></div>

      <!-- Section 4: Left Drawer Panel -->
      <aside class="drawer-panel bg-card" data-region="drawer-panel">
        <!-- Drawer Header -->
        <div class="border-b border-border px-4 pb-3 pt-4">
          <div class="flex items-center justify-between">
            <h2 class="text-base font-bold text-foreground">历史会话</h2>
            <button class="flex h-8 w-8 items-center justify-center rounded-lg bg-muted/50 text-muted-foreground hover:bg-muted" data-dom-id="drawer-close" aria-label="关闭抽屉">
              <i data-lucide="x" class="h-[18px] w-[18px]"></i>
            </button>
          </div>
          <!-- Search bar -->
          <div class="mt-3 flex h-10 items-center gap-2 rounded-lg bg-muted px-3">
            <i data-lucide="search" class="h-4 w-4 text-muted-foreground"></i>
            <input type="text" placeholder="搜索会话..." class="flex-1 bg-transparent text-sm text-foreground placeholder:text-muted-foreground focus:outline-none">
          </div>
          <!-- New session button -->
          <button class="mt-2 flex h-10 w-full items-center justify-center gap-2 rounded-lg bg-primary/10 text-sm font-medium text-primary" data-dom-id="drawer-new-session">
            <i data-lucide="plus" class="h-4 w-4"></i>
            <span>新会话</span>
          </button>
        </div>

        <!-- Drawer Session List -->
        <div class="session-list-scroll px-2 py-2">
          <!-- Group 1: 今天 -->
          <div class="sticky top-0 z-10 bg-card px-2 py-2 text-xs font-semibold uppercase tracking-wide text-muted-foreground">今天</div>
          <div class="flex cursor-pointer items-start gap-3 rounded-lg bg-primary/5 px-3 py-3 hover:bg-muted/50" data-dom-id="session-today-1">
            <div class="flex h-7 w-7 flex-shrink-0 items-center justify-center rounded-lg bg-primary/10">
              <i data-lucide="message-circle" class="h-3.5 w-3.5 text-primary"></i>
            </div>
            <div class="min-w-0 flex-1">
              <div class="truncate text-sm font-medium text-foreground">整理房间相关问答</div>
              <div class="mt-0.5 truncate text-xs text-muted-foreground">今天还有2个待完成任务...</div>
            </div>
            <div class="flex-shrink-0 text-xs text-muted-foreground">14:32</div>
          </div>
          <div class="flex cursor-pointer items-start gap-3 rounded-lg px-3 py-3 hover:bg-muted/50" data-dom-id="session-today-2">
            <div class="flex h-7 w-7 flex-shrink-0 items-center justify-center rounded-lg bg-primary/10">
              <i data-lucide="message-circle" class="h-3.5 w-3.5 text-primary"></i>
            </div>
            <div class="min-w-0 flex-1">
              <div class="truncate text-sm font-medium text-foreground">积分查询</div>
              <div class="mt-0.5 truncate text-xs text-muted-foreground">你当前有2850积分...</div>
            </div>
            <div class="flex-shrink-0 text-xs text-muted-foreground">10:15</div>
          </div>

          <!-- Group 2: 昨天 -->
          <div class="sticky top-0 z-10 bg-card px-2 py-2 text-xs font-semibold uppercase tracking-wide text-muted-foreground">昨天</div>
          <div class="flex cursor-pointer items-start gap-3 rounded-lg px-3 py-3 hover:bg-muted/50" data-dom-id="session-yesterday-1">
            <div class="flex h-7 w-7 flex-shrink-0 items-center justify-center rounded-lg bg-primary/10">
              <i data-lucide="message-circle" class="h-3.5 w-3.5 text-primary"></i>
            </div>
            <div class="min-w-0 flex-1">
              <div class="truncate text-sm font-medium text-foreground">今日任务咨询</div>
              <div class="mt-0.5 truncate text-xs text-muted-foreground">今天还有2个待完成任务...</div>
            </div>
            <div class="flex-shrink-0 text-xs text-muted-foreground">昨天</div>
          </div>
          <div class="flex cursor-pointer items-start gap-3 rounded-lg px-3 py-3 hover:bg-muted/50" data-dom-id="session-yesterday-2">
            <div class="flex h-7 w-7 flex-shrink-0 items-center justify-center rounded-lg bg-primary/10">
              <i data-lucide="message-circle" class="h-3.5 w-3.5 text-primary"></i>
            </div>
            <div class="min-w-0 flex-1">
              <div class="truncate text-sm font-medium text-foreground">成长报告</div>
              <div class="mt-0.5 truncate text-xs text-muted-foreground">你的成长指数提升了5点...</div>
            </div>
            <div class="flex-shrink-0 text-xs text-muted-foreground">昨天</div>
          </div>

          <!-- Group 3: 7天内 -->
          <div class="sticky top-0 z-10 bg-card px-2 py-2 text-xs font-semibold uppercase tracking-wide text-muted-foreground">7天内</div>
          <div class="flex cursor-pointer items-start gap-3 rounded-lg px-3 py-3 hover:bg-muted/50" data-dom-id="session-week-1">
            <div class="flex h-7 w-7 flex-shrink-0 items-center justify-center rounded-lg bg-primary/10">
              <i data-lucide="message-circle" class="h-3.5 w-3.5 text-primary"></i>
            </div>
            <div class="min-w-0 flex-1">
              <div class="truncate text-sm font-medium text-foreground">兑换建议</div>
              <div class="mt-0.5 truncate text-xs text-muted-foreground">距离兑换游戏时间还需...</div>
            </div>
            <div class="flex-shrink-0 text-xs text-muted-foreground">周三</div>
          </div>
          <div class="flex cursor-pointer items-start gap-3 rounded-lg px-3 py-3 hover:bg-muted/50" data-dom-id="session-week-2">
            <div class="flex h-7 w-7 flex-shrink-0 items-center justify-center rounded-lg bg-primary/10">
              <i data-lucide="message-circle" class="h-3.5 w-3.5 text-primary"></i>
            </div>
            <div class="min-w-0 flex-1">
              <div class="truncate text-sm font-medium text-foreground">能力成长分析</div>
              <div class="mt-0.5 truncate text-xs text-muted-foreground">你的学习能力维度...</div>
            </div>
            <div class="flex-shrink-0 text-xs text-muted-foreground">周二</div>
          </div>
          <div class="flex cursor-pointer items-start gap-3 rounded-lg px-3 py-3 hover:bg-muted/50" data-dom-id="session-week-3">
            <div class="flex h-7 w-7 flex-shrink-0 items-center justify-center rounded-lg bg-primary/10">
              <i data-lucide="message-circle" class="h-3.5 w-3.5 text-primary"></i>
            </div>
            <div class="min-w-0 flex-1">
              <div class="truncate text-sm font-medium text-foreground">阅读任务讨论</div>
              <div class="mt-0.5 truncate text-xs text-muted-foreground">阅读30分钟任务已...</div>
            </div>
            <div class="flex-shrink-0 text-xs text-muted-foreground">周一</div>
          </div>
        </div>
      </aside>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
