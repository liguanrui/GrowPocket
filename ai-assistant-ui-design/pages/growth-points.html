<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>积分兑换</title>
    <style id="theme-vars">
/* ===== GrowPocket AI Assistant — Design Tokens ===== */
/* Brand prefix: gp | Single primary hue: warm orange #F59E6B */

:root {
  /* --- Surfaces --- */
  --gp-background: #FFFAF4;
  --gp-foreground: #2D2A26;

  --gp-card: #FFFFFF;
  --gp-card-foreground: #2D2A26;

  --gp-popover: #FFFFFF;
  --gp-popover-foreground: #2D2A26;

  --gp-muted: #FFF1E6;
  --gp-muted-foreground: #7A7168;

  /* --- Brand primary (single hue) --- */
  --gp-primary: #F59E6B;
  --gp-primary-foreground: #FFFFFF;

  /* --- Lines & inputs --- */
  --gp-border: #F5E6D3;
  --gp-input: #F5E6D3;
  --gp-ring: #F59E6B;

  /* --- State colors (semantic only, not brand) --- */
  --gp-state-success: #6DBF7B;
  --gp-state-warning: #F0B848;
  --gp-state-error: #E87461;
  --gp-state-info: #5B9BD5;

  /* --- Radius scale --- */
  --gp-radius-sm: 8px;
  --gp-radius-md: 12px;
  --gp-radius-lg: 16px;
  --gp-radius-pill: 999px;

  /* --- Typography --- */
  --gp-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--gp-background);
    --color-foreground: var(--gp-foreground);
    --color-card: var(--gp-card);
    --color-card-foreground: var(--gp-card-foreground);
    --color-popover: var(--gp-popover);
    --color-popover-foreground: var(--gp-popover-foreground);
    --color-primary: var(--gp-primary);
    --color-primary-foreground: var(--gp-primary-foreground);
    --color-muted: var(--gp-muted);
    --color-muted-foreground: var(--gp-muted-foreground);
    --color-border: var(--gp-border);
    --color-input: var(--gp-input);
    --color-ring: var(--gp-ring);
    --radius-sm: var(--gp-radius-sm);
    --radius-md: var(--gp-radius-md);
    --radius-lg: var(--gp-radius-lg);
  }
  @layer base {
    body { background: var(--gp-background); color: var(--gp-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--gp-background); }
      .text-background { color: var(--gp-background); }
      .border-background { border-color: var(--gp-background); }
      .ring-background { --tw-ring-color: var(--gp-background); }
      .bg-foreground { background-color: var(--gp-foreground); }
      .text-foreground { color: var(--gp-foreground); }
      .border-foreground { border-color: var(--gp-foreground); }
      .ring-foreground { --tw-ring-color: var(--gp-foreground); }
      .bg-card { background-color: var(--gp-card); }
      .text-card { color: var(--gp-card); }
      .border-card { border-color: var(--gp-card); }
      .ring-card { --tw-ring-color: var(--gp-card); }
      .bg-card-foreground { background-color: var(--gp-card-foreground); }
      .text-card-foreground { color: var(--gp-card-foreground); }
      .border-card-foreground { border-color: var(--gp-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--gp-card-foreground); }
      .bg-popover { background-color: var(--gp-popover); }
      .text-popover { color: var(--gp-popover); }
      .border-popover { border-color: var(--gp-popover); }
      .ring-popover { --tw-ring-color: var(--gp-popover); }
      .bg-popover-foreground { background-color: var(--gp-popover-foreground); }
      .text-popover-foreground { color: var(--gp-popover-foreground); }
      .border-popover-foreground { border-color: var(--gp-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--gp-popover-foreground); }
      .bg-primary { background-color: var(--gp-primary); }
      .text-primary { color: var(--gp-primary); }
      .border-primary { border-color: var(--gp-primary); }
      .ring-primary { --tw-ring-color: var(--gp-primary); }
      .bg-primary-foreground { background-color: var(--gp-primary-foreground); }
      .text-primary-foreground { color: var(--gp-primary-foreground); }
      .border-primary-foreground { border-color: var(--gp-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--gp-primary-foreground); }
      .bg-muted { background-color: var(--gp-muted); }
      .text-muted { color: var(--gp-muted); }
      .border-muted { border-color: var(--gp-muted); }
      .ring-muted { --tw-ring-color: var(--gp-muted); }
      .bg-muted-foreground { background-color: var(--gp-muted-foreground); }
      .text-muted-foreground { color: var(--gp-muted-foreground); }
      .border-muted-foreground { border-color: var(--gp-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--gp-muted-foreground); }
      .bg-border { background-color: var(--gp-border); }
      .text-border { color: var(--gp-border); }
      .border-border { border-color: var(--gp-border); }
      .ring-border { --tw-ring-color: var(--gp-border); }
      .bg-input { background-color: var(--gp-input); }
      .text-input { color: var(--gp-input); }
      .border-input { border-color: var(--gp-input); }
      .ring-input { --tw-ring-color: var(--gp-input); }
      .bg-ring { background-color: var(--gp-ring); }
      .text-ring { color: var(--gp-ring); }
      .border-ring { border-color: var(--gp-ring); }
      .ring-ring { --tw-ring-color: var(--gp-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
    <style id="critical-layout">
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { max-width: 100%; overflow-x: clip; }
.app-shell {
  max-width: 448px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--gp-background);
  position: relative;
  box-shadow: 0 0 32px rgba(45, 42, 38, 0.06);
}
@media (max-width: 480px) { .app-shell { box-shadow: none; } }
.app-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255, 255, 255, 0.92);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--gp-border);
}
.app-body {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 16px 24px 16px;
}
.icon-20 { width: 20px; height: 20px; }
.icon-18 { width: 18px; height: 18px; }
.icon-16 { width: 16px; height: 16px; }
.icon-14 { width: 14px; height: 14px; }
.keep-all { word-break: keep-all; overflow-wrap: anywhere; }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <div class="app-shell">

      <!-- 1. Header (sticky) -->
      <header class="app-header px-4 py-3 flex items-center justify-between">
        <button type="button" aria-label="返回" class="w-9 h-9 rounded-full text-muted-foreground hover:bg-muted flex items-center justify-center">
          <i data-lucide="arrow-left" class="icon-20"></i>
        </button>
        <h1 class="text-base font-semibold text-foreground">积分兑换</h1>
        <button type="button" aria-label="兑换记录" class="w-9 h-9 rounded-full text-muted-foreground hover:bg-muted flex items-center justify-center">
          <i data-lucide="history" class="icon-20"></i>
        </button>
      </header>

      <!-- 2. App Body -->
      <main class="app-body">

        <!-- 2.1 Points Balance Banner -->
        <div class="rounded-2xl p-5 text-white" style="background: linear-gradient(135deg, #10b981 0%, #16a34a 100%);">
          <div class="flex items-center justify-between">
            <!-- Left: points number -->
            <div>
              <p class="text-sm text-white/80">我的积分</p>
              <p class="text-3xl font-bold text-white mt-1">2,850</p>
            </div>
            <!-- Right: circular progress ring -->
            <div class="flex flex-col items-center">
              <svg width="56" height="56" viewBox="0 0 56 56">
                <circle cx="28" cy="28" r="24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4"></circle>
                <circle cx="28" cy="28" r="24" fill="none" stroke="white" stroke-width="4"
                        stroke-dasharray="150.8" stroke-dashoffset="52.8"
                        stroke-linecap="round" transform="rotate(-90 28 28)"></circle>
                <text x="28" y="32" text-anchor="middle" font-size="10" font-weight="bold" fill="white">65%</text>
              </svg>
              <p class="text-[10px] text-white/70 text-center mt-1">本周目标</p>
            </div>
          </div>
          <!-- Bottom row -->
          <div class="mt-3 flex items-center gap-1">
            <i data-lucide="trending-up" class="w-3.5 h-3.5 text-white/80"></i>
            <p class="text-xs text-white/80">本周已赚 +320 积分</p>
          </div>
        </div>

        <!-- 2.2 Tab Bar -->
        <div class="mt-4 flex gap-2 bg-muted p-1 rounded-full">
          <button type="button" class="flex-1 flex items-center justify-center gap-1 py-2 rounded-full text-sm bg-card text-primary font-medium">
            <i data-lucide="shopping-bag" class="icon-16"></i>
            <span>可兑换</span>
          </button>
          <button type="button" class="flex-1 flex items-center justify-center gap-1 py-2 rounded-full text-sm text-muted-foreground">
            <i data-lucide="check-circle" class="icon-16"></i>
            <span>已兑换</span>
          </button>
          <button type="button" class="flex-1 flex items-center justify-center gap-1 py-2 rounded-full text-sm text-muted-foreground">
            <i data-lucide="receipt" class="icon-16"></i>
            <span>兑换记录</span>
          </button>
        </div>

        <!-- 2.3 Items Grid -->
        <div class="mt-4 grid grid-cols-2 gap-3">

          <!-- Item 1: 睡前故事绘本 (hot) -->
          <div class="bg-card rounded-xl border border-border overflow-hidden">
            <div class="h-28 relative flex items-center justify-center" style="background: linear-gradient(135deg, #10b981, #16a34a);">
              <span class="absolute top-0 left-0 px-1.5 py-0.5 rounded-bl-lg rounded-tr-lg text-[10px] font-medium text-white" style="background-color: #E87461;">热门</span>
              <i data-lucide="book-open" class="w-10 h-10 text-white/80"></i>
            </div>
            <div class="p-3">
              <p class="text-sm font-medium text-foreground truncate">睡前故事绘本</p>
              <p class="text-xs text-muted-foreground mt-0.5 truncate">精选童话合集</p>
              <div class="mt-2 flex items-center justify-between">
                <div class="flex items-center gap-1">
                  <i data-lucide="coins" class="w-3.5 h-3.5 text-primary"></i>
                  <span class="text-sm font-bold text-primary">500</span>
                </div>
                <button type="button" class="bg-primary text-primary-foreground px-3 py-1 rounded-full text-xs font-medium">兑换</button>
              </div>
            </div>
          </div>

          <!-- Item 2: 益智拼图玩具 -->
          <div class="bg-card rounded-xl border border-border overflow-hidden">
            <div class="h-28 relative flex items-center justify-center" style="background: linear-gradient(135deg, #5B9BD5, #4A90C2);">
              <i data-lucide="puzzle" class="w-10 h-10 text-white/80"></i>
            </div>
            <div class="p-3">
              <p class="text-sm font-medium text-foreground truncate">益智拼图玩具</p>
              <p class="text-xs text-muted-foreground mt-0.5 truncate">100片认知拼图</p>
              <div class="mt-2 flex items-center justify-between">
                <div class="flex items-center gap-1">
                  <i data-lucide="coins" class="w-3.5 h-3.5 text-primary"></i>
                  <span class="text-sm font-bold text-primary">800</span>
                </div>
                <button type="button" class="bg-primary text-primary-foreground px-3 py-1 rounded-full text-xs font-medium">兑换</button>
              </div>
            </div>
          </div>

          <!-- Item 3: 30分钟额外游戏时间 (hot) -->
          <div class="bg-card rounded-xl border border-border overflow-hidden">
            <div class="h-28 relative flex items-center justify-center" style="background: linear-gradient(135deg, #6DBF7B, #5BA86A);">
              <span class="absolute top-0 left-0 px-1.5 py-0.5 rounded-bl-lg rounded-tr-lg text-[10px] font-medium text-white" style="background-color: #E87461;">热门</span>
              <i data-lucide="gamepad-2" class="w-10 h-10 text-white/80"></i>
            </div>
            <div class="p-3">
              <p class="text-sm font-medium text-foreground truncate">30分钟额外游戏时间</p>
              <p class="text-xs text-muted-foreground mt-0.5 truncate">周末使用</p>
              <div class="mt-2 flex items-center justify-between">
                <div class="flex items-center gap-1">
                  <i data-lucide="coins" class="w-3.5 h-3.5 text-primary"></i>
                  <span class="text-sm font-bold text-primary">300</span>
                </div>
                <button type="button" class="bg-primary text-primary-foreground px-3 py-1 rounded-full text-xs font-medium">兑换</button>
              </div>
            </div>
          </div>

          <!-- Item 4: 小萌芽限定贴纸 -->
          <div class="bg-card rounded-xl border border-border overflow-hidden">
            <div class="h-28 relative flex items-center justify-center" style="background: linear-gradient(135deg, #E87461, #D6553F);">
              <i data-lucide="sticker" class="w-10 h-10 text-white/80"></i>
            </div>
            <div class="p-3">
              <p class="text-sm font-medium text-foreground truncate">小萌芽限定贴纸</p>
              <p class="text-xs text-muted-foreground mt-0.5 truncate">收集系列</p>
              <div class="mt-2 flex items-center justify-between">
                <div class="flex items-center gap-1">
                  <i data-lucide="coins" class="w-3.5 h-3.5 text-primary"></i>
                  <span class="text-sm font-bold text-primary">200</span>
                </div>
                <button type="button" class="bg-primary text-primary-foreground px-3 py-1 rounded-full text-xs font-medium">兑换</button>
              </div>
            </div>
          </div>

          <!-- Item 5: 科学实验套装 (sold out) -->
          <div class="bg-card rounded-xl border border-border overflow-hidden">
            <div class="h-28 relative flex items-center justify-center" style="background: linear-gradient(135deg, #9B7EBD, #7B5F9D);">
              <i data-lucide="flask-conical" class="w-10 h-10 text-white/80"></i>
            </div>
            <div class="p-3">
              <p class="text-sm font-medium text-foreground truncate">科学实验套装</p>
              <p class="text-xs text-muted-foreground mt-0.5 truncate">STEM启蒙</p>
              <div class="mt-2 flex items-center justify-between">
                <div class="flex items-center gap-1">
                  <i data-lucide="coins" class="w-3.5 h-3.5 text-primary"></i>
                  <span class="text-sm font-bold text-primary">1200</span>
                </div>
                <button type="button" class="bg-muted text-muted-foreground px-3 py-1 rounded-full text-xs font-medium" disabled>已兑完</button>
              </div>
            </div>
          </div>

          <!-- Item 6: 户外探险背包 -->
          <div class="bg-card rounded-xl border border-border overflow-hidden">
            <div class="h-28 relative flex items-center justify-center" style="background: linear-gradient(135deg, #F0B848, #D89E30);">
              <i data-lucide="backpack" class="w-10 h-10 text-white/80"></i>
            </div>
            <div class="p-3">
              <p class="text-sm font-medium text-foreground truncate">户外探险背包</p>
              <p class="text-xs text-muted-foreground mt-0.5 truncate">儿童款</p>
              <div class="mt-2 flex items-center justify-between">
                <div class="flex items-center gap-1">
                  <i data-lucide="coins" class="w-3.5 h-3.5 text-primary"></i>
                  <span class="text-sm font-bold text-primary">600</span>
                </div>
                <button type="button" class="bg-primary text-primary-foreground px-3 py-1 rounded-full text-xs font-medium">兑换</button>
              </div>
            </div>
          </div>

        </div>

        <!-- 2.4 Recent Activity Section -->
        <div class="mt-5">
          <div class="flex items-center justify-between">
            <h2 class="text-sm font-semibold text-foreground">最近兑换</h2>
            <button type="button" class="text-xs text-primary ml-auto">查看全部</button>
          </div>
          <div class="mt-3 bg-card rounded-xl border border-border divide-y divide-border">

            <!-- History Item 1 -->
            <div class="flex items-center gap-3 p-3">
              <div class="w-9 h-9 rounded-lg bg-muted flex items-center justify-center flex-shrink-0">
                <i data-lucide="gift" class="icon-18 text-muted-foreground"></i>
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm text-foreground font-medium truncate">益智拼图玩具</p>
                <p class="text-xs text-muted-foreground mt-0.5">2026-07-28</p>
              </div>
              <p class="text-sm font-medium text-muted-foreground flex-shrink-0">-800</p>
            </div>

            <!-- History Item 2 -->
            <div class="flex items-center gap-3 p-3">
              <div class="w-9 h-9 rounded-lg bg-muted flex items-center justify-center flex-shrink-0">
                <i data-lucide="gift" class="icon-18 text-muted-foreground"></i>
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm text-foreground font-medium truncate">睡前故事绘本</p>
                <p class="text-xs text-muted-foreground mt-0.5">2026-07-25</p>
              </div>
              <p class="text-sm font-medium text-muted-foreground flex-shrink-0">-500</p>
            </div>

            <!-- History Item 3 -->
            <div class="flex items-center gap-3 p-3">
              <div class="w-9 h-9 rounded-lg bg-muted flex items-center justify-center flex-shrink-0">
                <i data-lucide="gift" class="icon-18 text-muted-foreground"></i>
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm text-foreground font-medium truncate">小萌芽限定贴纸</p>
                <p class="text-xs text-muted-foreground mt-0.5">2026-07-20</p>
              </div>
              <p class="text-sm font-medium text-muted-foreground flex-shrink-0">-200</p>
            </div>

          </div>
        </div>

      </main>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
