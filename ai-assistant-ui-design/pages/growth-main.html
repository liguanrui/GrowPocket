<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成长记录</title>
    <style id="theme-vars">
/* ===== GrowPocket AI Assistant — Design Tokens ===== */
/* Brand prefix: gp | Single primary hue: warm orange #F59E6B */

:root {
  /* --- Surfaces --- */
  --gp-background: #FFFAF4;
  --gp-foreground: #2D2A26;

  --gp-card: #FFFFFF;
  --gp-card-foreground: #2D2A26;

  --gp-popover: #FFFFFF;
  --gp-popover-foreground: #2D2A26;

  --gp-muted: #FFF1E6;
  --gp-muted-foreground: #7A7168;

  /* --- Brand primary (single hue) --- */
  --gp-primary: #F59E6B;
  --gp-primary-foreground: #FFFFFF;

  /* --- Lines & inputs --- */
  --gp-border: #F5E6D3;
  --gp-input: #F5E6D3;
  --gp-ring: #F59E6B;

  /* --- State colors (semantic only, not brand) --- */
  --gp-state-success: #6DBF7B;
  --gp-state-warning: #F0B848;
  --gp-state-error: #E87461;
  --gp-state-info: #5B9BD5;

  /* --- Radius scale --- */
  --gp-radius-sm: 8px;
  --gp-radius-md: 12px;
  --gp-radius-lg: 16px;
  --gp-radius-pill: 999px;

  /* --- Typography --- */
  --gp-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--gp-background);
    --color-foreground: var(--gp-foreground);
    --color-card: var(--gp-card);
    --color-card-foreground: var(--gp-card-foreground);
    --color-popover: var(--gp-popover);
    --color-popover-foreground: var(--gp-popover-foreground);
    --color-primary: var(--gp-primary);
    --color-primary-foreground: var(--gp-primary-foreground);
    --color-muted: var(--gp-muted);
    --color-muted-foreground: var(--gp-muted-foreground);
    --color-border: var(--gp-border);
    --color-input: var(--gp-input);
    --color-ring: var(--gp-ring);
    --radius-sm: var(--gp-radius-sm);
    --radius-md: var(--gp-radius-md);
    --radius-lg: var(--gp-radius-lg);
  }
  @layer base {
    body { background: var(--gp-background); color: var(--gp-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--gp-background); }
      .text-background { color: var(--gp-background); }
      .border-background { border-color: var(--gp-background); }
      .ring-background { --tw-ring-color: var(--gp-background); }
      .bg-foreground { background-color: var(--gp-foreground); }
      .text-foreground { color: var(--gp-foreground); }
      .border-foreground { border-color: var(--gp-foreground); }
      .ring-foreground { --tw-ring-color: var(--gp-foreground); }
      .bg-card { background-color: var(--gp-card); }
      .text-card { color: var(--gp-card); }
      .border-card { border-color: var(--gp-card); }
      .ring-card { --tw-ring-color: var(--gp-card); }
      .bg-card-foreground { background-color: var(--gp-card-foreground); }
      .text-card-foreground { color: var(--gp-card-foreground); }
      .border-card-foreground { border-color: var(--gp-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--gp-card-foreground); }
      .bg-popover { background-color: var(--gp-popover); }
      .text-popover { color: var(--gp-popover); }
      .border-popover { border-color: var(--gp-popover); }
      .ring-popover { --tw-ring-color: var(--gp-popover); }
      .bg-popover-foreground { background-color: var(--gp-popover-foreground); }
      .text-popover-foreground { color: var(--gp-popover-foreground); }
      .border-popover-foreground { border-color: var(--gp-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--gp-popover-foreground); }
      .bg-primary { background-color: var(--gp-primary); }
      .text-primary { color: var(--gp-primary); }
      .border-primary { border-color: var(--gp-primary); }
      .ring-primary { --tw-ring-color: var(--gp-primary); }
      .bg-primary-foreground { background-color: var(--gp-primary-foreground); }
      .text-primary-foreground { color: var(--gp-primary-foreground); }
      .border-primary-foreground { border-color: var(--gp-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--gp-primary-foreground); }
      .bg-muted { background-color: var(--gp-muted); }
      .text-muted { color: var(--gp-muted); }
      .border-muted { border-color: var(--gp-muted); }
      .ring-muted { --tw-ring-color: var(--gp-muted); }
      .bg-muted-foreground { background-color: var(--gp-muted-foreground); }
      .text-muted-foreground { color: var(--gp-muted-foreground); }
      .border-muted-foreground { border-color: var(--gp-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--gp-muted-foreground); }
      .bg-border { background-color: var(--gp-border); }
      .text-border { color: var(--gp-border); }
      .border-border { border-color: var(--gp-border); }
      .ring-border { --tw-ring-color: var(--gp-border); }
      .bg-input { background-color: var(--gp-input); }
      .text-input { color: var(--gp-input); }
      .border-input { border-color: var(--gp-input); }
      .ring-input { --tw-ring-color: var(--gp-input); }
      .bg-ring { background-color: var(--gp-ring); }
      .text-ring { color: var(--gp-ring); }
      .border-ring { border-color: var(--gp-ring); }
      .ring-ring { --tw-ring-color: var(--gp-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
    <style>
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body { max-width: 100%; overflow-x: clip; }
      .app-shell {
        max-width: 448px;
        margin: 0 auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--gp-background);
        position: relative;
        box-shadow: 0 0 32px rgba(45, 42, 38, 0.06);
      }
      @media (max-width: 480px) { .app-shell { box-shadow: none; } }
      .app-header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: linear-gradient(135deg, #10b981 0%, #16a34a 100%);
        border-radius: 0 0 20px 20px;
        box-shadow: 0 4px 16px rgba(22, 163, 74, 0.25);
      }
      .app-body {
        flex: 1 1 auto;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0 0 24px 0;
      }
      .icon-20 { width: 20px; height: 20px; }
      .icon-18 { width: 18px; height: 18px; }
      .icon-16 { width: 16px; height: 16px; }
      .icon-14 { width: 14px; height: 14px; }
      .icon-12 { width: 12px; height: 12px; }
      .keep-all { word-break: keep-all; overflow-wrap: anywhere; }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
  <div class="app-shell">

    <!-- ===== Section 1: Header (sticky, colored) ===== -->
    <header class="app-header">
      <!-- Top row: title + subtitle (left) / share button (right) -->
      <div class="px-4 pt-4 pb-2 flex items-start justify-between">
        <div>
          <h1 class="text-2xl font-bold text-white tracking-tight">成长记录</h1>
          <p class="text-sm text-white/70 mt-0.5">记录每一个成长瞬间</p>
        </div>
        <button type="button" class="w-9 h-9 rounded-full bg-white/15 flex items-center justify-center text-white hover:bg-white/25 transition-colors shrink-0" aria-label="分享">
          <i data-lucide="share" class="icon-18"></i>
        </button>
      </div>

      <!-- Child switch pills (horizontal scroll) -->
      <div class="no-scrollbar overflow-x-auto flex gap-2 px-4 pb-3 pt-1" aria-label="切换孩子">
        <!-- 小明 (selected: white bg, primary text) -->
        <button type="button" class="shrink-0 px-3.5 py-1.5 rounded-full bg-white text-primary text-sm font-medium flex items-center gap-1.5 transition-colors">
          <span class="w-5 h-5 rounded-full bg-primary/15 flex items-center justify-center text-xs font-bold">明</span>
          小明
        </button>
        <!-- 小红 (unselected: translucent white) -->
        <button type="button" class="shrink-0 px-3.5 py-1.5 rounded-full bg-white/15 text-white text-sm flex items-center gap-1.5 transition-colors">
          <span class="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center text-xs">红</span>
          小红
        </button>
        <!-- 小华 -->
        <button type="button" class="shrink-0 px-3.5 py-1.5 rounded-full bg-white/15 text-white text-sm flex items-center gap-1.5 transition-colors">
          <span class="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center text-xs">华</span>
          小华
        </button>
        <!-- 小雨 -->
        <button type="button" class="shrink-0 px-3.5 py-1.5 rounded-full bg-white/15 text-white text-sm flex items-center gap-1.5 transition-colors">
          <span class="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center text-xs">雨</span>
          小雨
        </button>
      </div>
    </header>

    <!-- ===== Body ===== -->
    <main class="app-body">

      <!-- ===== Section 3: Stage Goals Card ===== -->
      <section class="px-4 mt-3">
        <div class="bg-card rounded-2xl border border-border p-4">
          <!-- Top row -->
          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <h2 class="text-sm font-semibold text-foreground">阶段目标</h2>
              <span class="ml-2 inline-flex items-center px-2 py-0.5 rounded-full bg-primary/10 text-primary text-xs font-medium keep-all">3-4岁 · 语言爆发期</span>
            </div>
            <button type="button" class="text-xs text-muted-foreground flex items-center hover:text-foreground transition-colors">
              查看详情
              <i data-lucide="chevron-right" class="icon-14 ml-0.5"></i>
            </button>
          </div>
          <!-- Goal text -->
          <p class="mt-3 text-sm text-muted-foreground keep-all">提升词汇表达能力，掌握50+日常用语</p>
          <!-- Progress bar -->
          <div class="mt-3">
            <div class="h-2 rounded-full bg-muted overflow-hidden">
              <div class="h-full rounded-full bg-primary" style="width: 65%"></div>
            </div>
            <div class="flex justify-between mt-1.5">
              <span class="text-xs text-muted-foreground">进度 65%</span>
              <span class="text-xs text-primary font-medium">32/50 词</span>
            </div>
          </div>
          <!-- Button row -->
          <div class="mt-4 flex gap-2">
            <button type="button" class="bg-primary text-primary-foreground flex-1 py-2.5 rounded-lg text-sm font-medium flex items-center justify-center gap-1.5 hover:opacity-90 transition-opacity">
              <i data-lucide="target" class="icon-16"></i>
              设置目标
            </button>
            <button type="button" class="bg-card border border-border text-foreground flex-1 py-2.5 rounded-lg text-sm font-medium flex items-center justify-center gap-1.5 hover:bg-muted/50 transition-colors">
              <i data-lucide="sliders-horizontal" class="icon-16"></i>
              调整目标
            </button>
            <button type="button" class="bg-card border border-border text-foreground px-4 py-2.5 rounded-lg text-sm font-medium flex items-center justify-center gap-1.5 hover:bg-muted/50 transition-colors">
              <i data-lucide="history" class="icon-16"></i>
              回顾
            </button>
          </div>
        </div>
      </section>

      <!-- ===== Section 4: Growth Dimension Chart + IP Character ===== -->
      <section class="px-4 mt-4">
        <div class="bg-card rounded-2xl border border-border p-4">
          <!-- Title row -->
          <div class="flex items-center justify-between">
            <h2 class="text-sm font-semibold text-foreground">成长维度</h2>
            <span class="text-xs text-muted-foreground">更新于 2026-07-30</span>
          </div>
          <!-- Content area: radar + IP -->
          <div class="mt-4 flex gap-4 items-center">
            <!-- Radar chart -->
            <svg width="180" height="180" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="shrink-0">
              <!-- Concentric pentagon grid lines (radius 80, 53, 27) -->
              <polygon points="100,20 176.08,75.28 147.02,164.72 52.98,164.72 23.92,75.28" fill="none" stroke="var(--gp-border)" stroke-width="1"/>
              <polygon points="100,47 150.41,83.62 131.15,142.88 68.85,142.88 49.59,83.62" fill="none" stroke="var(--gp-border)" stroke-width="1"/>
              <polygon points="100,73 125.68,91.66 115.87,121.84 84.13,121.84 74.32,91.66" fill="none" stroke="var(--gp-border)" stroke-width="1"/>
              <!-- Axis lines from center to outer vertices -->
              <line x1="100" y1="100" x2="100" y2="20" stroke="var(--gp-border)" stroke-width="1"/>
              <line x1="100" y1="100" x2="176.08" y2="75.28" stroke="var(--gp-border)" stroke-width="1"/>
              <line x1="100" y1="100" x2="147.02" y2="164.72" stroke="var(--gp-border)" stroke-width="1"/>
              <line x1="100" y1="100" x2="52.98" y2="164.72" stroke="var(--gp-border)" stroke-width="1"/>
              <line x1="100" y1="100" x2="23.92" y2="75.28" stroke="var(--gp-border)" stroke-width="1"/>
              <!-- Data polygon (语言78, 认知85, 运动62, 社交70, 情感68) -->
              <polygon points="100,37.6 164.67,78.99 129.15,140.13 67.08,145.3 48.26,83.19" fill="rgba(126, 200, 80, 0.15)" stroke="#7EC850" stroke-width="2"/>
              <!-- Data points -->
              <circle cx="100" cy="37.6" r="3" fill="var(--gp-primary)"/>
              <circle cx="164.67" cy="78.99" r="3" fill="var(--gp-primary)"/>
              <circle cx="129.15" cy="140.13" r="3" fill="var(--gp-primary)"/>
              <circle cx="67.08" cy="145.3" r="3" fill="var(--gp-primary)"/>
              <circle cx="48.26" cy="83.19" r="3" fill="var(--gp-primary)"/>
              <!-- Axis labels -->
              <text x="100" y="12" font-size="10" fill="var(--gp-muted-foreground)" text-anchor="middle">语言 78</text>
              <text x="185" y="75" font-size="10" fill="var(--gp-muted-foreground)" text-anchor="middle">认知 85</text>
              <text x="150" y="185" font-size="10" fill="var(--gp-muted-foreground)" text-anchor="middle">运动 62</text>
              <text x="50" y="185" font-size="10" fill="var(--gp-muted-foreground)" text-anchor="middle">社交 70</text>
              <text x="15" y="75" font-size="10" fill="var(--gp-muted-foreground)" text-anchor="middle">情感 68</text>
            </svg>
            <!-- IP character area -->
            <div class="flex-shrink-0 flex flex-col items-center gap-2">
              <img src="../assets/ip-sprouty-hero.jpg" alt="小萌芽" class="w-20 h-20 rounded-2xl object-cover">
              <span class="bg-primary/10 text-primary text-xs font-semibold px-2.5 py-1 rounded-full keep-all">Lv.5 萌芽期</span>
              <span class="text-xs text-muted-foreground">成长值 1240</span>
            </div>
          </div>
          <!-- Dimension scores list -->
          <div class="mt-4 grid grid-cols-5 gap-1">
            <div class="flex flex-col items-center">
              <span class="w-2 h-2 rounded-full bg-primary"></span>
              <span class="text-xs font-semibold mt-1">78</span>
              <span class="text-[10px] text-muted-foreground">语言</span>
            </div>
            <div class="flex flex-col items-center">
              <span class="w-2 h-2 rounded-full" style="background-color: #6DBF7B;"></span>
              <span class="text-xs font-semibold mt-1">85</span>
              <span class="text-[10px] text-muted-foreground">认知</span>
            </div>
            <div class="flex flex-col items-center">
              <span class="w-2 h-2 rounded-full" style="background-color: #5B9BD5;"></span>
              <span class="text-xs font-semibold mt-1">62</span>
              <span class="text-[10px] text-muted-foreground">运动</span>
            </div>
            <div class="flex flex-col items-center">
              <span class="w-2 h-2 rounded-full" style="background-color: #F0B848;"></span>
              <span class="text-xs font-semibold mt-1">70</span>
              <span class="text-[10px] text-muted-foreground">社交</span>
            </div>
            <div class="flex flex-col items-center">
              <span class="w-2 h-2 rounded-full" style="background-color: #E87461;"></span>
              <span class="text-xs font-semibold mt-1">68</span>
              <span class="text-[10px] text-muted-foreground">情感</span>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== Section 5: Points Redemption Card ===== -->
      <section class="px-4 mt-4">
        <div class="bg-card rounded-2xl border border-border p-4" style="background: linear-gradient(135deg, #F0FDF4 0%, #FFFFFF 100%)">
          <div class="flex items-center justify-between">
            <div class="min-w-0">
              <div class="flex items-center gap-1.5">
                <i data-lucide="gift" class="icon-20 text-primary"></i>
                <h2 class="text-sm font-semibold text-foreground">积分兑换</h2>
              </div>
              <div class="mt-1 flex items-baseline gap-1">
                <span class="text-2xl font-bold text-primary">2,850</span>
                <span class="text-sm text-muted-foreground">积分</span>
              </div>
              <p class="mt-0.5 text-xs text-muted-foreground">本周已兑换 2 件</p>
            </div>
            <button type="button" data-dom-id="points-enter" class="bg-primary text-primary-foreground px-4 py-2 rounded-full text-sm font-medium flex items-center gap-1 hover:opacity-90 transition-opacity shrink-0">
              进入兑换
              <i data-lucide="arrow-right" class="icon-16"></i>
            </button>
          </div>
        </div>
      </section>

      <!-- ===== Section 6: Growth Story Card ===== -->
      <section class="px-4 mt-4">
        <div class="bg-card rounded-2xl border border-border p-4">
          <!-- Title row -->
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5">
              <i data-lucide="book-open" class="icon-20 text-primary"></i>
              <h2 class="text-sm font-semibold text-foreground">成长故事</h2>
            </div>
            <button type="button" data-dom-id="story-view-all" class="text-xs text-primary font-medium flex items-center hover:opacity-80 transition-opacity">
              查看全部
              <i data-lucide="chevron-right" class="icon-16 ml-0.5"></i>
            </button>
          </div>
          <!-- Story preview items -->
          <div class="mt-3 space-y-3">
            <!-- Item 1 -->
            <div>
              <div class="flex items-center">
                <span class="inline-flex px-2 py-0.5 rounded-full bg-primary/10 text-primary text-xs font-medium">语言</span>
                <span class="ml-auto text-xs text-muted-foreground">07-30</span>
              </div>
              <p class="mt-1.5 text-sm text-foreground font-medium keep-all">第一次主动说完整句子</p>
              <p class="mt-0.5 text-xs text-muted-foreground line-clamp-1">今天小明主动用完整句子表达想要喝水...</p>
            </div>
            <!-- Item 2 -->
            <div>
              <div class="flex items-center">
                <span class="inline-flex px-2 py-0.5 rounded-full text-xs font-medium" style="background-color: rgba(109, 191, 123, 0.1); color: #6DBF7B;">认知</span>
                <span class="ml-auto text-xs text-muted-foreground">07-28</span>
              </div>
              <p class="mt-1.5 text-sm text-foreground font-medium keep-all">认识了几何形状</p>
              <p class="mt-0.5 text-xs text-muted-foreground line-clamp-1">能够正确区分圆形、三角形和正方形...</p>
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- ===== Section 7: Bottom Tab Bar (sticky bottom) ===== -->
    <nav class="sticky bottom-0 z-50 bg-card/95 backdrop-blur border-t border-border flex justify-around py-2">
      <button type="button" class="flex flex-col items-center gap-0.5 text-muted-foreground px-2">
        <i data-lucide="home" class="icon-16"></i>
        <span class="text-xs">首页</span>
      </button>
      <button type="button" class="flex flex-col items-center gap-0.5 text-primary px-2">
        <i data-lucide="sprout" class="icon-16"></i>
        <span class="text-xs font-medium">成长</span>
      </button>
      <button type="button" class="flex flex-col items-center gap-0.5 text-muted-foreground px-2">
        <i data-lucide="message-circle" class="icon-16"></i>
        <span class="text-xs">AI助理</span>
      </button>
      <button type="button" class="flex flex-col items-center gap-0.5 text-muted-foreground px-2">
        <i data-lucide="user" class="icon-16"></i>
        <span class="text-xs">我的</span>
      </button>
    </nav>

  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
